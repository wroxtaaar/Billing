name: Apply uploaded Billing project
on:
  push:
    paths:
      - '.github/workflows/apply-updated-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and extract uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          archive="Billing-main-updated.zip"
          test -s "$archive"
          unzip -t "$archive"
          mkdir -p /tmp/billing-updated
          unzip -q "$archive" -d /tmp/billing-updated
          source_dir="/tmp/billing-updated/Billing-main"
          test -s "$source_dir/WebApp/index.html"
          test -s "$source_dir/WebApp/sw.js"
          test -s "$source_dir/.github/workflows/android-apk.yml"
          test -s "$source_dir/Android/SaveInvoicePlugin.java"
          test -s "$source_dir/Android/native-share-entry.js"
          python3 -m json.tool "$source_dir/WebApp/manifest.webmanifest" >/dev/null
          echo "Validated updated source tree:"
          find "$source_dir" -type f -printf '%P (%s bytes)\n' | sort
      - name: Replace old project files with archive contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/billing-updated/Billing-main/ ./
          rm -f Billing-main-updated.zip
          rm -f .github/workflows/inspect-uploaded-zip.yml
          echo "New repository root:"
          find . -maxdepth 3 -type f ! -path './.git/*' -printf '%P\n' | sort
      - name: Commit replacement directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Replace project with uploaded updated source"
          git push origin HEAD:main
