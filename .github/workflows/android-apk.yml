name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WebApp/**"
      - "Android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' SDK package has been removed from Google's repositories.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Prepare Capacitor Android wrapper
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor/app@7
          npm install --save-dev --save-exact @capacitor/cli@7 esbuild
          mkdir -p www
          cp -R WebApp/. www/
          npx esbuild Android/native-share-entry.js --bundle --format=iife --platform=browser --outfile=www/capacitor-native-share.js
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fancysteelworks.invoice",
            "appName": "Fancy Steel Works",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          mkdir -p android/app/src/main/java/com/fancysteelworks/invoice
          cp Android/SaveInvoicePlugin.java android/app/src/main/java/com/fancysteelworks/invoice/SaveInvoicePlugin.java
          cat > android/app/src/main/java/com/fancysteelworks/invoice/MainActivity.java <<'EOF'
          package com.fancysteelworks.invoice;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveInvoicePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fancy-steel-invoice-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
