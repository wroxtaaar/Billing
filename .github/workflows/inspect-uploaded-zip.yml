name: Inspect uploaded project archive
on:
  push:
    paths:
      - '.github/workflows/inspect-uploaded-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect uploaded project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/updated
          unzip -q Billing-main-updated.zip -d /tmp/updated
          root=/tmp/updated/Billing-main
          echo "=== ARCHIVE FILES ==="
          find "$root" -type f -printf '%P (%s bytes)\n' | sort
          echo "=== RENDER CONFIG ==="
          cat "$root/render.yaml"
          echo "=== ANDROID BUILD WORKFLOW ==="
          cat "$root/.github/workflows/android-apk.yml"
          echo "=== ANDROID NATIVE PLUGIN ==="
          cat "$root/Android/SaveInvoicePlugin.java"
          echo "=== ANDROID JS BRIDGE ==="
          cat "$root/Android/native-share-entry.js"
          echo "=== WEB APP EXPORT REFERENCES ==="
          grep -n -E 'html-to-image|html2canvas|__nativeInvoiceSave|makeInvoicePng|downloadPreviewPng|Download invoice' "$root/WebApp/index.html" || true
          echo "=== WEB APP SERVICE WORKER ==="
          cat "$root/WebApp/sw.js"
