name: Extract WebApp source
on:
  push:
    paths:
      - ".github/workflows/extract-webapp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract web app into WebApp/
        run: |
          test -f WebApp/FancySteelInvoice-webapp.zip
          mkdir -p /tmp/fancy-steel-web
          unzip -q WebApp/FancySteelInvoice-webapp.zip -d /tmp/fancy-steel-web
          cp -a /tmp/fancy-steel-web/webapp/. WebApp/
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WebApp
          if ! git diff --cached --quiet; then
            git commit -m "Extract runnable web app into WebApp folder"
            git push origin HEAD:main
          fi
