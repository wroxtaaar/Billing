services:
  - type: web
    name: fancy-steel-invoice-app
    runtime: static
    buildCommand: echo "No build step required for this static PWA"
    staticPublishPath: WebApp
    autoDeploy: true
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
